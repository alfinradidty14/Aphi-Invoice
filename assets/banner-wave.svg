<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>

    <!-- Warm Neon Ridge Gradient (Orange to Coral to Peach) -->
    <linearGradient id="warmRidge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Cool Blue / Violet Shadow Gradient -->
    <linearGradient id="coolShadow" x1="0%" y1="30%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="800" height="240" fill="url(#bgGrad)"/>

  <!-- Background Ambient Glow Blobs -->
  <circle cx="580" cy="110" r="130" fill="#f97316" opacity="0.25" filter="url(#glow)"/>
  <circle cx="280" cy="150" r="140" fill="#2563eb" opacity="0.3" filter="url(#glow)"/>
  <circle cx="420" cy="80" r="100" fill="#7c3aed" opacity="0.25" filter="url(#glow)"/>

  <!-- Deep Fluid Underside Ribbon (Cool Blue to Indigo) -->
  <path d="M 0,180 C 180,180 250,70 380,65 C 470,60 550,140 800,90 L 800,240 L 0,240 Z" fill="url(#coolShadow)" opacity="0.85"/>

  <!-- Inner Dark Fold Ribbon for Depth -->
  <path d="M 120,200 C 260,190 320,80 430,70 C 520,60 620,130 800,105 L 800,240 L 120,240 Z" fill="#06080e" opacity="0.9"/>

  <!-- Main Sweeping Fluid Wave Structure -->
  <path d="M 0,165 C 160,165 240,60 370,55 C 490,50 560,160 800,120 L 800,240 L 0,240 Z" fill="#090a0f"/>

  <!-- Glow Underlay for Warm Peak -->
  <path d="M 280,110 C 340,65 410,48 480,55 C 550,62 630,105 760,135" fill="none" stroke="#f97316" stroke-width="28" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- Main Radiant Warm Ridge Highlight (Matching the orange/red arc) -->
  <path d="M 290,110 C 350,65 415,48 480,55 C 550,62 625,105 750,135" fill="none" stroke="url(#warmRidge)" stroke-width="12" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Sharp Glossy Rim Line -->
  <path d="M 320,95 C 370,62 420,50 480,56 C 540,62 610,98 720,130" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8" stroke-linecap="round"/>

  <!-- Cool Accent Rim on Left Curve -->
  <path d="M 50,165 C 130,165 210,140 280,100" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7" stroke-linecap="round" filter="url(#subtleGlow)"/>
  <path d="M 60,165 C 130,165 210,140 275,103" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="240" fill="none" stroke="#1f242e" stroke-width="1" opacity="0.2"/>
</svg>